Embeds:
  CreateTicketEmbed:
    panelsFormat: "{emoji} » {name}"
    color: "{color-default}"
    title: "Phiếu Hỗ Trợ"
    description: |
      🌟 Xin chào! Bạn đang gặp khó khăn hay cần hỗ trợ kỹ thuật?
      Tạo phiếu hỗ trợ (Ticket) là cách tốt nhất để liên hệ trực tiếp với đội ngũ quản trị viên của chúng tôi. Bạn có thể mở ticket cho bất kỳ vấn đề nào. Đội ngũ kỹ thuật sẽ cố gắng hết sức để giải quyết sự cố của bạn nhanh nhất có thể.

      {panels}

      ⏰ Ban quản trị sẽ phản hồi nhanh nhất có thể trong mỗi ticket, vui lòng không nhắc (ping) quản trị viên trừ khi đó là trường hợp cực kỳ khẩn cấp.
    footer:
      text: "Hệ thống hỗ trợ"
      iconURL: "{bot-pfp}"
  OpenedTicketEmbed:
    content: "{owner}"
    title: "{emoji} {panel}"
    color: "{color-default}"
    description: |
      Cảm ơn bạn đã gửi yêu cầu hỗ trợ! Nhân viên kỹ thuật sẽ có mặt trong giây lát.
      Trong thời gian chờ đợi, vui lòng cung cấp thêm thông tin hoặc trả lời câu hỏi dưới đây.

      **Danh mục hỗ trợ:** {panel}
      **Người yêu cầu hỗ trợ:** {owner}
  OpenedTicketWithQuestionsEmbed:
    content: "{owner}"
    title: "{emoji} {panel}"
    color: "{color-default}"
